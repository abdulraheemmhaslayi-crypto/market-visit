# ==============================================================================
# Apache Production VirtualHost Configuration for dandyapp.tech / VPS
# Project Path: /var/www/market-visit
# ==============================================================================

<VirtualHost *:80>
    ServerName dandyapp.tech
    ServerAlias www.dandyapp.tech

    # 1. EXCLUDE /uploads from ProxyPass reverse proxy to Next.js (CRITICAL)
    ProxyPass /uploads !

    # 2. Directly serve /uploads from local storage directory with long-term caching
    Alias /uploads /var/www/market-visit/uploads

    <Directory /var/www/market-visit/uploads>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Static asset caching headers
        <IfModule mod_headers.c>
            Header set Cache-Control "max-age=31536000, public, immutable"
            Header set Access-Control-Allow-Origin "*"
        </IfModule>
    </Directory>

    # 3. Next.js Reverse Proxy
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/market-visit-error.log
    CustomLog ${APACHE_LOG_DIR}/market-visit-access.log combined
</VirtualHost>
